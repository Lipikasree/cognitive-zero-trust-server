server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: czts-jsonl
    static_configs:
      - targets: [localhost]
        labels:
          job: czts
          __path__: /var/log/czts/events.jsonl
    pipeline_stages:
      - json:
          expressions:
            event_type: event_type
            state: state
      - labels:
          event_type:
          state:
