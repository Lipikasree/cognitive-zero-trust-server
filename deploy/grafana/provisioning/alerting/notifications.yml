apiVersion: 1
contactPoints:
  - orgId: 1
    name: CZTS local capture and email
    receivers:
      - uid: czts_local_webhook
        type: webhook
        settings:
          url: http://alert-sink:8080/alerts
          httpMethod: POST
      - uid: czts_email
        type: email
        settings:
          addresses: $GF_ALERT_RECIPIENT
policies:
  - orgId: 1
    receiver: CZTS local capture and email
    group_by:
      - grafana_folder
      - alertname
      - session_id
